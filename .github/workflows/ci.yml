name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Gate (typecheck, lint, tests)
        run: python scripts/gate.py
      - name: Dependency audit
        run: npm audit --audit-level=high

  # The frontend is a separate app in frontend/. This job does nothing until that folder exists.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint and build the frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On a pull request the scanner lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
